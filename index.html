<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cloti Music</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--tg-theme-bg-color, #1a1a2e);
      color: var(--tg-theme-text-color, #ffffff);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      padding: 32px 24px;
      width: 100%;
      max-width: 360px;
    }

    .logo {
      font-size: 48px;
      filter: drop-shadow(0 0 20px rgba(255,255,255,0.3));
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      text-align: center;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.55);
      text-align: center;
      margin-top: -20px;
      line-height: 1.5;
    }

    /* ── BOTÓN CIRCULAR ────────────────────────────────────── */
    .btn-wrapper {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ripple {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(108, 92, 231, 0.25);
      animation: none;
      transform: scale(1);
    }

    .ripple.active {
      animation: ripple-out 1.4s ease-out infinite;
    }

    .ripple2 {
      animation-delay: 0.7s;
    }

    @keyframes ripple-out {
      0%   { transform: scale(1);   opacity: 0.6; }
      100% { transform: scale(1.9); opacity: 0; }
    }

    .btn-main {
      position: relative;
      z-index: 10;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(145deg, #7c5cbf, #5a3f9e);
      box-shadow: 0 8px 32px rgba(92, 63, 158, 0.55), 0 2px 8px rgba(0,0,0,0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      -webkit-user-select: none;
      user-select: none;
    }

    .btn-main:active {
      transform: scale(0.95);
      box-shadow: 0 4px 16px rgba(92, 63, 158, 0.4);
    }

    .btn-main.recording {
      background: linear-gradient(145deg, #e74c3c, #c0392b);
      box-shadow: 0 8px 32px rgba(231, 76, 60, 0.55);
      animation: pulse-red 1.2s ease-in-out infinite;
    }

    .btn-main.found {
      background: linear-gradient(145deg, #27ae60, #1e8449);
      box-shadow: 0 8px 32px rgba(39, 174, 96, 0.55);
    }

    @keyframes pulse-red {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.04); }
    }

    .btn-icon { font-size: 44px; line-height: 1; }
    .btn-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.9);
    }

    /* ── ESTADO ─────────────────────────────────────────────── */
    .status-area {
      min-height: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    .status-text {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .status-text.visible { opacity: 1; }

    .status-sub {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .status-sub.visible { opacity: 1; }

    /* ── ONDA ANIMADA (escuchando) ───────────────────────────── */
    .wave-bars {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 28px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .wave-bars.visible { opacity: 1; }

    .bar {
      width: 5px;
      border-radius: 3px;
      background: #e74c3c;
      animation: none;
    }

    .wave-bars.visible .bar {
      animation: wave 0.9s ease-in-out infinite;
    }

    .bar:nth-child(1) { animation-delay: 0s;    height: 8px; }
    .bar:nth-child(2) { animation-delay: 0.12s; height: 14px; }
    .bar:nth-child(3) { animation-delay: 0.24s; height: 22px; }
    .bar:nth-child(4) { animation-delay: 0.36s; height: 16px; }
    .bar:nth-child(5) { animation-delay: 0.48s; height: 10px; }
    .bar:nth-child(6) { animation-delay: 0.12s; height: 20px; }
    .bar:nth-child(7) { animation-delay: 0.28s; height: 12px; }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.5); opacity: 0.6; }
      50%       { transform: scaleY(1.4); opacity: 1; }
    }

    /* ── RESULTADO ──────────────────────────────────────────── */
    .result-card {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 20px;
      display: none;
      flex-direction: row;
      gap: 16px;
      align-items: center;
    }

    .result-card.visible { display: flex; }

    .result-cover {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      background: rgba(255,255,255,0.1);
    }

    .result-info { flex: 1; min-width: 0; }

    .result-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-artist {
      font-size: 13px;
      color: rgba(255,255,255,0.65);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-meta {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      margin-top: 6px;
    }

    /* ── BOTÓN REINICIAR ─────────────────────────────────────── */
    .btn-retry {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 13px;
      padding: 10px 24px;
      border-radius: 24px;
      cursor: pointer;
      display: none;
      transition: background 0.2s;
    }

    .btn-retry.visible { display: block; }
    .btn-retry:active { background: rgba(255,255,255,0.2); }

    /* ── ERROR ──────────────────────────────────────────────── */
    .error-msg {
      font-size: 13px;
      color: #e74c3c;
      text-align: center;
      display: none;
    }

    .error-msg.visible { display: block; }
  </style>
</head>
<body>
<div class="container">
  <div class="logo">🎵</div>
  <div>
    <div class="title">Identificar canción</div>
    <div class="subtitle">Pulsa el botón y acerca<br>el móvil a la música</div>
  </div>

  <!-- Botón principal -->
  <div class="btn-wrapper">
    <div class="ripple" id="ripple1"></div>
    <div class="ripple ripple2" id="ripple2"></div>
    <button class="btn-main" id="btnMain" onclick="handleTap()">
      <span class="btn-icon" id="btnIcon">🎤</span>
      <span class="btn-label" id="btnLabel">Escuchar</span>
    </button>
  </div>

  <!-- Onda animada -->
  <div class="wave-bars" id="waveBars">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div>
  </div>

  <!-- Estado -->
  <div class="status-area">
    <div class="status-text" id="statusText"></div>
    <div class="status-sub" id="statusSub"></div>
  </div>

  <!-- Resultado -->
  <div class="result-card" id="resultCard">
    <img class="result-cover" id="resultCover" src="" alt="">
    <div class="result-info">
      <div class="result-title" id="resultTitle"></div>
      <div class="result-artist" id="resultArtist"></div>
      <div class="result-meta" id="resultMeta"></div>
    </div>
  </div>

  <!-- Error -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- Reiniciar -->
  <button class="btn-retry" id="btnRetry" onclick="reset()">🔄 Identificar otra</button>
</div>

<script>
  // ── Telegram WebApp init ───────────────────────────────────────────────────
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.enableClosingConfirmation();
  }

  // ── Estado ─────────────────────────────────────────────────────────────────
  let state = 'idle'; // idle | recording | processing | found | error
  let mediaRecorder = null;
  let audioChunks = [];
  let recordingTimer = null;
  const RECORD_SECS = 20;
  const BACKEND_URL = 'https://cloti-music.arturoferri-ops.workers.dev/identify';

  // ── UI helpers ─────────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);

  function setStatus(text, sub = '') {
    $('statusText').textContent = text;
    $('statusText').classList.toggle('visible', !!text);
    $('statusSub').textContent = sub;
    $('statusSub').classList.toggle('visible', !!sub);
  }

  function setWave(on) {
    $('waveBars').classList.toggle('visible', on);
  }

  function setRipple(on) {
    $('ripple1').classList.toggle('active', on);
    $('ripple2').classList.toggle('active', on);
  }

  function setBtn(icon, label, cls) {
    $('btnIcon').textContent = icon;
    $('btnLabel').textContent = label;
    const btn = $('btnMain');
    btn.classList.remove('recording', 'found');
    if (cls) btn.classList.add(cls);
  }

  // ── Flujo principal ────────────────────────────────────────────────────────
  async function handleTap() {
    if (state === 'idle')       startRecording();
    else if (state === 'recording') stopRecording();
  }

  async function startRecording() {
    // Pedir permiso micrófono
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      showError('Necesito permiso al micrófono. Ve a Ajustes → Telegram → Micrófono.');
      return;
    }

    state = 'recording';
    audioChunks = [];

    // Elegir formato compatible
    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? 'audio/webm;codecs=opus'
      : MediaRecorder.isTypeSupported('audio/mp4')
        ? 'audio/mp4'
        : 'audio/webm';

    mediaRecorder = new MediaRecorder(stream, { mimeType });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => { stream.getTracks().forEach(t => t.stop()); sendAudio(); };
    mediaRecorder.start(250);

    setBtn('⏹', 'Parar', 'recording');
    setRipple(true);
    setWave(true);
    setStatus('Escuchando…', 'Acerca el móvil a la música');
    $('errorMsg').classList.remove('visible');

    // Auto-stop a los RECORD_SECS segundos
    let secs = RECORD_SECS;
    recordingTimer = setInterval(() => {
      secs--;
      setStatus('Escuchando…', `Acerca el móvil a la música (${secs}s)`);
      if (secs <= 0) stopRecording();
    }, 1000);
  }

  function stopRecording() {
    if (recordingTimer) { clearInterval(recordingTimer); recordingTimer = null; }
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    state = 'processing';
    setBtn('⏳', 'Analizando', '');
    setRipple(false);
    setWave(false);
    setStatus('Identificando canción…', 'Un momento');
    $('btnMain').disabled = true;
  }

  async function sendAudio() {
    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
    const formData = new FormData();
    formData.append('audio', blob, 'recording.webm');

    // Pasar telegram_id del usuario al backend
    const userId = tg?.initDataUnsafe?.user?.id || 'unknown';
    formData.append('telegram_id', String(userId));

    try {
      const res = await fetch(BACKEND_URL, { method: 'POST', body: formData });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      showResult(data);
    } catch (e) {
      showError('No se pudo identificar. Intenta con más audio o mejor señal.');
      console.error(e);
    }
  }

  function showResult(data) {
    state = 'found';
    setBtn('✅', 'Identificada', 'found');
    setStatus('¡Encontrada!', 'La ficha ya está en camino 🎵');

    $('resultTitle').textContent  = data.title  || '—';
    $('resultArtist').textContent = data.artist || '—';
    $('resultMeta').textContent   = [data.album, data.released].filter(Boolean).join(' · ');
    if (data.cover) $('resultCover').src = data.cover;
    $('resultCard').classList.add('visible');
    $('btnRetry').classList.add('visible');
    $('btnMain').disabled = false;

    // Cerrar Mini App tras 4 segundos
    setTimeout(() => { if (tg) tg.close(); }, 4000);
  }

  function showError(msg) {
    state = 'idle';
    setBtn('🎤', 'Escuchar', '');
    setRipple(false);
    setWave(false);
    setStatus('');
    $('errorMsg').textContent = msg;
    $('errorMsg').classList.add('visible');
    $('btnMain').disabled = false;
  }

  function reset() {
    state = 'idle';
    audioChunks = [];
    setBtn('🎤', 'Escuchar', '');
    setRipple(false);
    setWave(false);
    setStatus('');
    $('resultCard').classList.remove('visible');
    $('btnRetry').classList.remove('visible');
    $('errorMsg').classList.remove('visible');
    $('btnMain').disabled = false;
  }
</script>
</body>
</html>
